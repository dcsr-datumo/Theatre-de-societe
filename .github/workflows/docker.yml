name: containers

on:
  push:
    branches: ["master"]
    tags:
      - "app-v*"
      - "updater-v*"
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate ${{ matrix.component }} (AMD64, no publish)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: application
            context: site_2020/code/site2020
            image: platec/tds
          - component: cache-updater
            context: site_2020/code/scripts
            image: platec/tds_cache_updater

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate bundled cache schemas
        if: ${{ matrix.component == 'cache-updater' }}
        shell: bash
        run: |
          set -euo pipefail
          for file in authors_cache.json calendar_cache.json places_cache.json works_cache.json; do
            bash site_2020/code/scripts/validate-cache.sh \
              "site_2020/code/site2020/src/assets/cache/$file" \
              "$file"
          done

      - name: Build without publishing
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify cache-updater secret boundary
        if: ${{ matrix.component == 'cache-updater' }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.image }}:ci-${{ github.sha }}"
          docker run --rm "$image" \
            bash -lc 'test ! -e /app/env && test -f /app/validate-cache.sh'
          if docker run --rm "$image"; then
            echo "Updater unexpectedly succeeded without a credential" >&2
            exit 1
          fi

  publish-application:
    name: Publish application image
    if: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract application image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: platec/tds
          flavor: latest=false
          tags: |
            type=match,pattern=app-(v.*),group=1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish application
        uses: docker/build-push-action@v5
        with:
          context: site_2020/code/site2020
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  publish-cache-updater:
    name: Publish cache-updater image
    if: ${{ startsWith(github.ref, 'refs/tags/updater-v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract cache-updater image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: platec/tds_cache_updater
          flavor: latest=false
          tags: |
            type=match,pattern=updater-(v.*),group=1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish cache updater
        uses: docker/build-push-action@v5
        with:
          context: site_2020/code/scripts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cache-updater
          cache-to: type=gha,mode=max,scope=cache-updater
